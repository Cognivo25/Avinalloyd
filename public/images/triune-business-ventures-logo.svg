<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <!-- Dark Navy Gradient for Central Mountain Peak -->
    <linearGradient id="peakCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4d8f"/>
      <stop offset="35%" stop-color="#193368"/>
      <stop offset="70%" stop-color="#12244c"/>
      <stop offset="100%" stop-color="#0c1834"/>
    </linearGradient>

    <!-- Side Peaks Gradient -->
    <linearGradient id="peakSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23437f"/>
      <stop offset="50%" stop-color="#162e60"/>
      <stop offset="100%" stop-color="#0e1f42"/>
    </linearGradient>

    <!-- Warm Gold Gradient for Inner Triangles -->
    <linearGradient id="goldTriGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed136"/>
      <stop offset="50%" stop-color="#f5b301"/>
      <stop offset="100%" stop-color="#e09900"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="mountain-emblem">
    <!-- LEFT PEAK -->
    <polygon points="248,70 120,230 384,230" fill="url(#peakSideGrad)"/>
    <!-- Left Inner Golden Triangle -->
    <polygon points="280,146 226,230 334,230" fill="url(#goldTriGrad)"/>
    <!-- Left Triangle White Cut Line -->
    <polyline points="248,70 120,230 384,230 248,70" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- RIGHT PEAK -->
    <polygon points="552,70 416,230 680,230" fill="url(#peakSideGrad)"/>
    <!-- Right Inner Golden Triangle -->
    <polygon points="520,146 466,230 574,230" fill="url(#goldTriGrad)"/>
    <!-- Right Triangle White Cut Line -->
    <polyline points="552,70 416,230 680,230 552,70" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- CENTER PEAK (Overlays and anchors the other two) -->
    <polygon points="400,20 264,230 536,230" fill="url(#peakCenterGrad)"/>
    <!-- Center Peak Facet Shading for 3D depth -->
    <polygon points="400,20 400,230 536,230" fill="#0c1834" fill-opacity="0.28"/>
    <polygon points="400,20 264,230 400,230" fill="url(#glossHighlight)"/>
    <!-- Center Peak White Outline Border -->
    <polyline points="400,20 264,230 536,230 400,20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Inner Accent Cuts -->
    <line x1="280" y1="146" x2="350" y2="230" stroke="#ffffff" stroke-width="4.5"/>
    <line x1="520" y1="146" x2="450" y2="230" stroke="#ffffff" stroke-width="4.5"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g id="logo-text" fill="#132654">
    <!-- Main Title: TRIUNE BUSINESS VENTURES PVT. LTD. -->
    <text x="400" y="278" text-anchor="middle" font-family="'Cinzel', 'Rockwell', 'Georgia', serif" font-weight="900" font-size="28" letter-spacing="1.2" style="font-variant: small-caps;">
      TRIUNE BUSINESS VENTURES <tspan font-size="20" font-weight="800">PVT. LTD.</tspan>
    </text>

    <!-- Subtitle: A CONGLOMERATE COMPANY -->
    <text x="400" y="312" text-anchor="middle" font-family="'Cinzel', 'Outfit', 'Montserrat', sans-serif" font-weight="800" font-size="18" letter-spacing="4">
      A CONGLOMERATE COMPANY
    </text>
  </g>
</svg>
