<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="alGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb86c" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9a7236" />
    </linearGradient>

    <!-- Dark Gradient for background disc -->
    <linearGradient id="alDarkDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1d1b" />
      <stop offset="100%" stop-color="#100f0e" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="60" cy="60" r="56" fill="url(#alDarkDisc)" stroke="url(#alGoldGrad)" stroke-width="2" />
  
  <!-- Subtle Inner Hairline Ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#c5a059" stroke-width="0.75" stroke-dasharray="3,2" opacity="0.6" />

  <!-- Monogram Lettering: AL -->
  <g transform="translate(60, 60)" text-anchor="middle" dominant-baseline="central">
    <!-- Letter A -->
    <text x="-9" y="4" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-weight="700" font-size="44" fill="url(#alGoldGrad)" letter-spacing="-2">
      A
    </text>
    
    <!-- Letter L Interlocking -->
    <text x="13" y="10" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-weight="600" font-size="38" fill="#ffffff" opacity="0.95" letter-spacing="-1">
      L
    </text>

    <!-- Central Diamond Accent -->
    <polygon points="0,-24 3,-20 0,-16 -3,-20" fill="#c5a059" />
  </g>
</svg>
