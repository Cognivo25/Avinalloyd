    />
    <path
      fill="url(#alGold)"
      d="M 210 105 L 100 340 L 80 340 L 80 350 L 155 350 L 155 340 L 132 340 L 195 200 C 190 220 160 250 130 268 C 170 252 220 258 268 300 L 260 270 C 220 238 180 234 148 245 L 210 105 Z"
    />

